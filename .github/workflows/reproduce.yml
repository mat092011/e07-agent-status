name: Reproduce E07 offline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B -m unittest discover -v
      - name: Audit frozen plans and reproduce archived results (no inference)
        run: python -B tools/release_check.py
